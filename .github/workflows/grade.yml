name: Grade Symmetric Encryption Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography
      
      - name: Run crypto_lab.py
        run: python crypto_lab.py
      
      - name: Run ECB Penguin demo
        run: python ecb_penguin.py
      
      - name: Run Nonce Reuse demo
        run: python nonce_reuse_demo.py
      
      - name: Validate findings.csv
        run: python tests/test_crypto.py